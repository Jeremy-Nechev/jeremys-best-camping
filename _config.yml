title: "Jeremy's Best Camping"
description: >-
  Campground guides for California's national parks, Southern California, and Northern California.

# This repo deploys as a GitHub Pages *project* page:
# https://jeremy-nechev.github.io/jeremys-best-camping/
# `url` is just the domain; `baseurl` (leading slash, no trailing slash) is the repo path that
# every internal link and asset gets prefixed with. If you ever move this to a custom domain or
# rename the repo to jeremy-nechev.github.io (a user page, served at the domain root), set
# baseurl back to "" and url to that domain instead.
baseurl: "/jeremys-best-camping"
url: "https://jeremy-nechev.github.io"

exclude:
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - node_modules
