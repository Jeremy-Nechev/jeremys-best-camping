<header class="site-header">
  <div class="wrap header-inner">
    <a class="wordmark" href="{{ '/' | relative_url }}">
      <span class="wordmark-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 3 L21 20 H3 Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 11 L16.5 20 H7.5 Z" fill="currentColor"/></svg>
      </span>
      <span class="wordmark-text">Jeremy's<br><em>Best Camping</em></span>
    </a>
    <button class="menu-toggle" aria-expanded="false" aria-controls="primary-nav">
      <span class="bars" aria-hidden="true"></span><span class="menu-label">Menu</span>
    </button>
    <nav id="primary-nav" class="primary-nav" aria-label="Primary">
      <ul class="nav-list">
<li class="nav-item has-menu{% if page.section == 'destinations' %} is-active{% endif %}">
<button class="nav-link" aria-expanded="false">Destinations<svg class="chev" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
<ul class="submenu">
{% for item in site.data.nav.destinations %}<li><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
{% endfor %}</ul></li>
<li class="nav-item has-menu{% if page.section == 'plan' %} is-active{% endif %}">
<button class="nav-link" aria-expanded="false">Plan a trip<svg class="chev" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
<ul class="submenu">
{% for item in site.data.nav.plan %}<li><a href="{{ item.url | relative_url }}">{{ item.title }}</a></li>
{% endfor %}</ul></li>
      </ul>
    </nav>
  </div>
</header>
